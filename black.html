<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title></title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
  }
</style>
</head>
<body>
<script>
(() => {
  const DEFAULT_URL = "https://en.wikipedia.org/";
  const BACKEND_BASE = "https://noteslockscreen-backend.onrender.com";
  const params = new URLSearchParams(window.location.search);
  const queryUrl = (params.get("url") || "").trim();
  const queryShortcut = (params.get("shortcut") || "").trim();
  const querySafari = params.get("safari");
  let targetUrl = queryUrl || DEFAULT_URL;
  let shortcutUrl = queryShortcut || "";
  let useSafari = querySafari === "1";

  fetch(BACKEND_BASE + "/api/config", { cache: "no-store" })
    .then((r) => (r.ok ? r.json() : null))
    .then((cfg) => {
      if (!cfg) return;
      if (!queryUrl && typeof cfg.blackRedirectUrl === "string" && cfg.blackRedirectUrl.trim()) {
        targetUrl = cfg.blackRedirectUrl.trim();
      }
      if (!queryShortcut && typeof cfg.shortcutUrl === "string" && cfg.shortcutUrl.trim()) {
        shortcutUrl = cfg.shortcutUrl.trim();
      }
      if (querySafari === null && typeof cfg.blackRedirectSafari === "boolean") {
        useSafari = cfg.blackRedirectSafari;
      }
    })
    .catch(() => {});

  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

  function normalizeUrl(u) {
    let dest = (u || "").trim();
    if (!dest) return "";
    if (!/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(dest)) dest = "https://" + dest;
    return dest;
  }

  let triggered = false;
  function go(e) {
    if (triggered) return;
    triggered = true;
    if (e && e.cancelable) e.preventDefault();

    let dest = normalizeUrl(targetUrl);
    if (useSafari && isIOS) {
      if (/^https:\/\//i.test(dest)) dest = dest.replace(/^https:\/\//i, "x-safari-https://");
      else if (/^http:\/\//i.test(dest)) dest = dest.replace(/^http:\/\//i, "x-safari-http://");
    }

    const sc = normalizeUrl(shortcutUrl);
    if (sc) {
      let redirected = false;
      const goDest = () => {
        if (redirected) return;
        redirected = true;
        window.location.replace(dest);
      };
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") goDest();
      }, { once: true });
      window.location.href = sc;
      setTimeout(goDest, 150);
    } else {
      window.location.replace(dest);
    }
  }

  window.addEventListener("pointerdown", go, { passive: false });
  window.addEventListener("click", go, { passive: false });
})();
</script>
</body>
</html>
