<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Notes</title>
<script src="aurakit.js"></script>
<style>
  :root{
    --bg:#000000;
    --fg:#ffffff;
    --glass-bg:rgba(36, 36, 40, 0.88);
    --glass-border:rgba(255, 255, 255, 0.14);
    --glass-hi:rgba(255, 255, 255, 0.22);
    --gold:#eab308;
    --gold-top:#f6be18;
    --gold-bot:#d99500;
    --caret:#f5b400;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;width:100%;height:100%;
    background:#000;color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ================= iOS 26 APPLE NOTES ================= */
  .notes-app{
    position:fixed;inset:0;
    display:flex;flex-direction:column;
    background:#000;color:#fff;
    padding-top:max(14px, env(safe-area-inset-top, 14px));
  }

  /* Top Liquid Glass Navigation Bar */
  .notes-nav{
    display:flex;align-items:center;justify-content:space-between;
    padding:8px 16px 10px;
    flex:none;
    z-index:20;
  }
  .glass-circle-btn{
    width:44px;height:44px;border-radius:50%;
    background:var(--glass-bg);
    border:1px solid var(--glass-border);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.16), 0 4px 14px rgba(0,0,0,0.4);
    backdrop-filter:blur(22px) saturate(160%);
    -webkit-backdrop-filter:blur(22px) saturate(160%);
    color:#fff;
    display:inline-flex;align-items:center;justify-content:center;
    cursor:pointer;padding:0;flex:none;
    transition:transform .1s ease, opacity .15s ease;
  }
  .glass-circle-btn:active,.glass-pill-group button:active,.gold-done-btn:active{
    transform:scale(0.95);opacity:0.82;
  }

  .notes-nav-right{
    display:flex;align-items:center;gap:10px;
  }
  .glass-pill-group{
    height:44px;border-radius:999px;
    background:var(--glass-bg);
    border:1px solid var(--glass-border);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.16), 0 4px 14px rgba(0,0,0,0.4);
    backdrop-filter:blur(22px) saturate(160%);
    -webkit-backdrop-filter:blur(22px) saturate(160%);
    display:inline-flex;align-items:center;
    padding:0 6px;gap:2px;
  }
  .glass-pill-group.single-circle{
    width:44px;padding:0;justify-content:center;
  }
  .pill-icon-btn{
    width:38px;height:38px;border-radius:50%;
    border:0;background:transparent;color:#fff;
    display:inline-flex;align-items:center;justify-content:center;
    cursor:pointer;padding:0;
  }
  .pill-icon-btn.disabled{
    opacity:0.32;pointer-events:none;
  }

  .gold-done-btn{
    width:44px;height:44px;border-radius:50%;
    background:linear-gradient(180deg, var(--gold-top) 0%, var(--gold-bot) 100%);
    border:1px solid rgba(255,230,130,0.45);
    box-shadow:inset 0 1px 1px rgba(255,255,255,0.4), 0 4px 14px rgba(0,0,0,0.45);
    color:#fff;
    display:none;align-items:center;justify-content:center;
    cursor:pointer;padding:0;flex:none;
  }
  .gold-done-btn.show{display:inline-flex;}

  /* Seamless Black Note Canvas (No Date header, No Title placeholder) */
  .notes-stage{
    position:relative;
    flex:1;min-height:0;
    display:flex;flex-direction:column;
  }
  .notes-body{
    flex:1;width:100%;
    border:0;background:transparent;color:#fff;
    caret-color:var(--caret);
    font-size:18px;font-weight:400;line-height:1.45;
    padding:10px 20px 140px;
    resize:none;outline:none;font-family:inherit;
    overflow-y:auto;-webkit-overflow-scrolling:touch;
  }
  .notes-draw-canvas{
    position:absolute;inset:0;width:100%;height:100%;
    pointer-events:none;touch-action:none;z-index:10;
  }
  .notes-app.mode-draw .notes-draw-canvas{pointer-events:auto;}
  .notes-app.mode-draw .notes-body{pointer-events:none;user-select:none;}

  /* ================= STATE 1: IDLE BOTTOM BAR (00:04) ================= */
  .idle-bottom-bar{
    position:fixed;
    left:16px;right:16px;
    bottom:max(18px, calc(env(safe-area-inset-bottom, 16px) + 4px));
    display:flex;align-items:center;justify-content:space-between;
    z-index:25;
    pointer-events:none;
  }
  .idle-bottom-bar > *{pointer-events:auto;}
  .notes-app.mode-typing .idle-bottom-bar,
  .notes-app.mode-draw .idle-bottom-bar{
    display:none;
  }
  .idle-left-pill{
    height:48px;border-radius:999px;
    background:var(--glass-bg);
    border:1px solid var(--glass-border);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.16), 0 6px 20px rgba(0,0,0,0.5);
    backdrop-filter:blur(24px) saturate(160%);
    -webkit-backdrop-filter:blur(24px) saturate(160%);
    display:inline-flex;align-items:center;
    padding:0 12px;gap:12px;
  }
  .idle-compose-btn{
    width:48px;height:48px;border-radius:50%;
    background:var(--glass-bg);
    border:1px solid var(--glass-border);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.16), 0 6px 20px rgba(0,0,0,0.5);
    backdrop-filter:blur(24px) saturate(160%);
    -webkit-backdrop-filter:blur(24px) saturate(160%);
    color:#fff;
    display:inline-flex;align-items:center;justify-content:center;
    cursor:pointer;padding:0;
  }

  /* ================= STATE 2: KEYBOARD ACCESSORY CAPSULE (00:00-00:06) ================= */
  .kb-bar-wrap{
    position:fixed;
    left:12px;right:12px;
    bottom:max(14px, env(safe-area-inset-bottom, 12px));
    z-index:26;
    display:none;
    transition:bottom 0.08s ease-out;
  }
  .notes-app.mode-typing .kb-bar-wrap{display:block;}
  .kb-capsule{
    height:46px;border-radius:999px;
    background:rgba(38, 38, 42, 0.92);
    border:1px solid rgba(255, 255, 255, 0.14);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.16), 0 6px 20px rgba(0,0,0,0.55);
    backdrop-filter:blur(24px) saturate(160%);
    -webkit-backdrop-filter:blur(24px) saturate(160%);
    display:flex;align-items:center;justify-content:space-around;
    padding:0 10px;
  }
  .kb-tool-btn{
    width:38px;height:38px;border-radius:50%;
    border:0;background:transparent;color:#fff;
    display:inline-flex;align-items:center;justify-content:center;
    cursor:pointer;padding:0;font-family:inherit;
    font-size:18px;font-weight:500;
  }
  .kb-tool-btn.gold-active{
    background:linear-gradient(180deg, var(--gold-top) 0%, var(--gold-bot) 100%);
    color:#fff;font-weight:700;
  }

  /* ================= STATE 3: PENCILKIT MARKUP TRAY (00:07-00:15) ================= */
  .pk-wrap{
    position:fixed;
    left:12px;right:12px;
    bottom:max(14px, env(safe-area-inset-bottom, 12px));
    z-index:30;
    display:none;
    flex-direction:column;
    align-items:center;
  }
  .notes-app.mode-draw .pk-wrap{display:flex;}

  /* PencilKit Floating Popovers (Stroke / Opacity & Eraser Mode) */
  .pk-popover{
    background:rgba(36, 36, 40, 0.96);
    border:1px solid rgba(255,255,255,0.14);
    border-radius:24px;
    box-shadow:0 12px 32px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.14);
    backdrop-filter:blur(26px) saturate(170%);
    -webkit-backdrop-filter:blur(26px) saturate(170%);
    padding:14px 16px;
    margin-bottom:10px;
    display:none;
    flex-direction:column;
    gap:12px;
  }
  .pk-popover.show{display:flex;}

  /* Stroke Width + Opacity Popover (00:09) */
  .pk-stroke-Popover{
    align-self:flex-start;
    margin-left:4px;
    width:248px;
  }
  .pk-squiggles{
    display:flex;align-items:center;justify-content:space-between;gap:6px;
  }
  .pk-sq-btn{
    width:38px;height:38px;border-radius:10px;
    border:0;background:transparent;color:#fff;
    display:inline-flex;align-items:center;justify-content:center;
    cursor:pointer;padding:0;
  }
  .pk-sq-btn.sel{
    background:#ffffff;color:#000000;
  }
  .pk-opacity-track{
    position:relative;height:28px;border-radius:14px;overflow:hidden;
    background-image:
      linear-gradient(45deg, #555 25%, transparent 25%),
      linear-gradient(-45deg, #555 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #555 75%),
      linear-gradient(-45deg, transparent 75%, #555 75%);
    background-size:10px 10px;
    background-position:0 0, 0 5px, 5px -5px, -5px 0;
    background-color:#333;
    display:flex;align-items:center;
  }
  .pk-opacity-fill{
    position:absolute;inset:0;
    background:linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,1) 100%);
    pointer-events:none;
  }
  .pk-opacity-range{
    position:relative;z-index:2;width:100%;margin:0;
    -webkit-appearance:none;appearance:none;background:transparent;height:28px;cursor:pointer;
  }
  .pk-opacity-range::-webkit-slider-thumb{
    -webkit-appearance:none;width:24px;height:24px;border-radius:50%;
    background:#fff;border:2px solid rgba(0,0,0,0.25);box-shadow:0 2px 6px rgba(0,0,0,0.45);
  }

  /* Eraser Popover (00:13) */
  .pk-eraser-popover{
    width:288px;
    align-items:center;
  }
  .pk-seg{
    width:100%;display:grid;grid-template-columns:1fr 1fr;
    background:rgba(255,255,255,0.08);border-radius:999px;padding:3px;
  }
  .pk-seg button{
    border:0;background:transparent;color:rgba(255,255,255,0.65);
    font-size:13.5px;font-weight:600;padding:7px 10px;border-radius:999px;
    cursor:pointer;font-family:inherit;
  }
  .pk-seg button.sel{
    background:rgba(255,255,255,0.22);color:#fff;
  }
  .pk-eraser-x-box{
    width:40px;height:40px;border-radius:10px;
    background:#fff;color:#000;
    display:inline-flex;align-items:center;justify-content:center;
    font-size:18px;font-weight:600;
  }

  /* Color Swatch Popover */
  .pk-color-popover{
    align-self:flex-end;margin-right:8px;
    flex-direction:row;gap:10px;padding:12px 14px;
  }
  .pk-color-dot{
    width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;
  }
  .pk-color-dot.sel{border-color:#fff;transform:scale(1.12);}

  /* Main PencilKit Capsule Tray */
  .pk-tray{
    position:relative;
    width:100%;max-width:420px;height:82px;
    border-radius:41px;
    background:rgba(30, 30, 34, 0.94);
    border:1px solid rgba(255, 255, 255, 0.13);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.15), 0 10px 28px rgba(0,0,0,0.65);
    backdrop-filter:blur(26px) saturate(160%);
    -webkit-backdrop-filter:blur(26px) saturate(160%);
    display:flex;align-items:center;justify-content:space-between;
    padding:0 22px 0 28px;
    overflow:hidden;
  }
  .pk-grabber{
    position:absolute;top:6px;left:50%;transform:translateX(-50%);
    width:26px;height:3.5px;border-radius:2px;background:rgba(255,255,255,0.26);
  }
  .pk-tools-row{
    display:flex;align-items:flex-end;gap:18px;height:100%;padding-top:10px;
  }
  .pk-tool{
    border:0;background:transparent;padding:0;cursor:pointer;
    width:30px;height:74px;
    display:flex;align-items:flex-end;justify-content:center;
    transform:translateY(13px);
    transition:transform 0.18s cubic-bezier(0.22, 1.2, 0.36, 1);
  }
  .pk-tool.sel{
    transform:translateY(1px);
  }
  .pk-tool svg{
    width:28px;height:72px;display:block;
    filter:drop-shadow(0 2px 5px rgba(0,0,0,0.5));
  }

  .pk-right-controls{
    display:flex;align-items:center;gap:14px;
  }
  .pk-wheel-btn{
    width:30px;height:30px;border-radius:50%;
    border:2px solid rgba(255,255,255,0.85);
    background:conic-gradient(#ff3b30, #ff9500, #ffcc00, #34c759, #00c7be, #007aff, #5856d6, #af52de, #ff2d55, #ff3b30);
    cursor:pointer;padding:0;
    box-shadow:0 2px 6px rgba(0,0,0,0.4);
  }
  .pk-plus-btn{
    width:30px;height:30px;border-radius:50%;
    border:0;background:rgba(255,255,255,0.12);color:#fff;
    display:inline-flex;align-items:center;justify-content:center;
    cursor:pointer;padding:0;
  }

  /* Custom Screenshot Outcome Screen */
  .custom-shot-view{
    position:fixed;inset:0;z-index:9998;background:#000;
    display:none;align-items:center;justify-content:center;
  }
  .custom-shot-view.show{display:flex;}
  .custom-shot-view img{width:100%;height:100%;object-fit:cover;display:block;}
  .custom-shot-bottom-tap{
    position:fixed;left:0;right:0;bottom:0;
    height:calc(72px + env(safe-area-inset-bottom, 20px));
    z-index:2;background:transparent;border:0;padding:0;cursor:pointer;
  }

  /* ================= FAKE iOS 26 LOCK SCREEN ================= */
  .lockscreen{
    position:fixed;inset:0;z-index:9999;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    background:#000;color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",sans-serif;
    -webkit-user-select:none;user-select:none;
    touch-action:manipulation;
    visibility:hidden;pointer-events:none;opacity:0;
    transform:scale(1);
    will-change:opacity, transform;
  }
  .lockscreen.open{visibility:visible;pointer-events:auto;opacity:1;transform:scale(1);transition:none;}
  .lockscreen.open.unlocking{
    pointer-events:none !important;background:transparent !important;opacity:0 !important;
    transform:scale(1.06) !important;
    transition:opacity 0.28s cubic-bezier(0.22, 1, 0.36, 1), transform 0.28s cubic-bezier(0.22, 1, 0.36, 1) !important;
  }
  .lockscreen-bg{
    position:absolute;inset:0;background-size:cover;background-position:center top;
    filter:blur(var(--lock-blur, 0px)) brightness(1) saturate(1.02);
    transform:none;opacity:1;pointer-events:none;background-color:#111;
  }
  .lockscreen.has-wallpaper .lockscreen-bg{background-color:transparent;}
  .lockscreen.has-wallpaper:not(.ai-clean) .lockscreen-bg{
    filter:blur(var(--lock-blur, 75px)) brightness(0.90) saturate(1.15) !important;
    transform:scale(1.18) !important;
  }
  .lockscreen.ai-clean .lockscreen-bg{filter:none !important;transform:none !important;inset:0 !important;}
  .lockscreen-scrim{position:absolute;inset:0;background:rgba(0,0,0,0.06);pointer-events:none;}
  .lockscreen-content{
    position:relative;z-index:2;width:100%;height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding-top:max(136px, calc(env(safe-area-inset-top, 54px) + 82px));
    opacity:0;transform:translateY(40px);will-change:opacity, transform;
  }
  .lockscreen.open .lockscreen-content{animation:lockIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;}
  @keyframes lockIn{0%{opacity:0;transform:translateY(40px);}100%{opacity:1;transform:translateY(0);}}
  .lockscreen-bottomspace{flex:1 1 auto;min-height:clamp(36px, 5.5vh, 62px);}
  .lockscreen-prompt-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;margin:0 0 12px 0;padding:0 24px;text-align:center;}
  .lockscreen-prompt{font-size:22px;font-weight:400;letter-spacing:-0.2px;margin:0;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,0.32);cursor:pointer;}
  .lockscreen-subprompt{font-size:14.5px;font-weight:400;letter-spacing:-0.1px;color:rgba(255,255,255,0.92);line-height:1.28;text-align:center;margin-top:2px;text-shadow:0 1px 3px rgba(0,0,0,0.32);}
  .lockscreen-dots{display:flex;min-height:14px;align-items:center;justify-content:center;margin:0 0 clamp(38px, 5.2vh, 52px) 0;cursor:pointer;touch-action:manipulation;padding:8px 16px;}
  .lockscreen-dots.dots-6{gap:21px;}
  .lockscreen-dots.dots-4{gap:28px;}
  .lockscreen-dot{width:13px;height:13px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.92);background:transparent;transition:background .12s ease, border-color .12s ease, transform .14s cubic-bezier(0.22, 1.35, 0.36, 1);}
  .lockscreen-dot.filled{background:#fff;border-color:#fff;transform:scale(1.06);}
  @keyframes shakePasscode{0%,100%{transform:translateX(0);}15%{transform:translateX(-14px);}30%{transform:translateX(12px);}45%{transform:translateX(-10px);}60%{transform:translateX(8px);}75%{transform:translateX(-4px);}}
  .lockscreen-dots.shake{animation:shakePasscode 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;}
  .lockscreen-keypad{display:grid;grid-template-columns:repeat(3, clamp(76px, 20.2vw, 84px));gap:clamp(14px, 2.0vh, 18px) clamp(22px, 6.0vw, 27px);justify-content:center;margin:0;}
  .lockscreen-key{
    position:relative;width:clamp(76px, 20.2vw, 84px);height:clamp(76px, 20.2vw, 84px);
    border-radius:50%;border:0;cursor:pointer;color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;padding:0;line-height:1;overflow:hidden;isolation:isolate;
    background:radial-gradient(120% 120% at 50% 24%, rgba(255, 255, 255, 0.20) 0%, rgba(255, 255, 255, 0.08) 55%, rgba(0, 0, 0, 0.12) 100%);
    backdrop-filter:blur(8px) brightness(1.16) saturate(135%);-webkit-backdrop-filter:blur(8px) brightness(1.16) saturate(135%);
    box-shadow:0 4px 16px rgba(0, 0, 0, 0.24);
    transform:scale(1) translateZ(0);
    transition:transform 0.38s cubic-bezier(0.22, 1.32, 0.36, 1), box-shadow 0.36s ease;
    will-change:transform;
  }
  .lockscreen-key.has-lens{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;}
  .lockscreen-key .glass-lens{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;pointer-events:none;z-index:0;display:block;}
  .lockscreen-key .glass-rim{
    position:absolute;inset:0;border-radius:50%;pointer-events:none;z-index:1;padding:1px;
    background:conic-gradient(from 315deg, rgba(255,255,255,0.78) 0deg, rgba(255,255,255,0.46) 44deg, rgba(255,255,255,0.12) 94deg, rgba(255,255,255,0.16) 136deg, rgba(255,255,255,0.64) 182deg, rgba(255,255,255,0.36) 224deg, rgba(255,255,255,0.12) 274deg, rgba(255,255,255,0.48) 324deg, rgba(255,255,255,0.78) 360deg);
    -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);mask-composite:exclude;
  }
  .lockscreen-key .glass-flash{
    position:absolute;inset:0;border-radius:50%;pointer-events:none;z-index:2;opacity:0;
    background:radial-gradient(circle at 50% 45%, rgba(255,255,255,0.60) 0%, rgba(255,255,255,0.44) 68%, rgba(255,255,255,0.68) 100%);
    box-shadow:inset 0 0 0 1.5px rgba(255,255,255,0.92);
    transition:opacity 0.36s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .lockscreen-key.is-pressed{
    transform:scale(1.14) translateZ(0) !important;
    transition:transform 0.065s cubic-bezier(0.2, 0.9, 0.3, 1), box-shadow 0.05s ease-out !important;
    box-shadow:0 8px 26px rgba(0, 0, 0, 0.32), 0 0 18px rgba(255, 255, 255, 0.22);
    z-index:10;
  }
  .lockscreen-key.is-pressed .glass-flash{opacity:1;transition:opacity 0.04s ease-out;}
  .lockscreen-key.is-pressed .glass-rim{filter:brightness(1.45);}
  .lockscreen-key.glass-mode-backdrop{
    border:1px solid rgba(255,255,255,0.48) !important;
    background:radial-gradient(125% 125% at 50% 22%, rgba(255,255,255,0.32) 0%, rgba(255,255,255,0.12) 50%, rgba(255,255,255,0.04) 80%, rgba(0,0,0,0.12) 100%) !important;
    backdrop-filter:blur(3.5px) brightness(1.28) saturate(145%) contrast(106%) !important;
    -webkit-backdrop-filter:blur(3.5px) brightness(1.28) saturate(145%) contrast(106%) !important;
    box-shadow:inset 0 2px 3px 0 rgba(255,255,255,0.85), inset 0 -1.5px 2px 0 rgba(0,0,0,0.35), 0 5px 16px rgba(0,0,0,0.24) !important;
  }
  .lockscreen-key.glass-mode-backdrop::before{
    content:"";position:absolute;inset:1.5px;border-radius:50%;
    background:linear-gradient(180deg, rgba(255,255,255,0.50) 0%, rgba(255,255,255,0.15) 38%, rgba(255,255,255,0) 68%);
    pointer-events:none;z-index:1;
  }
  .lockscreen-key.glass-mode-backdrop .glass-lens,
  .lockscreen-key.glass-mode-backdrop .glass-rim{display:none;}
  .lockscreen-key .digit{position:relative;z-index:3;font-size:37px;font-weight:400;line-height:37px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,0.18);}
  .lockscreen-key .letters{position:relative;z-index:3;font-size:10px;font-weight:700;letter-spacing:1.9px;margin-top:2px;color:#fff;text-transform:uppercase;line-height:11px;height:11px;text-shadow:0 1px 2px rgba(0,0,0,0.18);}
  .lockscreen-key .letters.empty{visibility:hidden;}
  .lockscreen-key.key-0{justify-content:center;}
  .lockscreen-key.key-0 .digit{line-height:1;}
  .lockscreen-corner-zone{width:clamp(76px, 20.2vw, 84px);height:clamp(76px, 20.2vw, 84px);border-radius:50%;border:0;padding:0;background:transparent !important;pointer-events:auto;touch-action:none;cursor:default;outline:none;}

  /* Noteify API Peek */
  .lockscreen-noteify-peek{
    position:fixed;inset:0;z-index:10060;display:none;
    flex-direction:column;align-items:center;justify-content:flex-start;
    padding:max(58px, calc(env(safe-area-inset-top, 44px) + 14px)) 24px 32px;
    background:linear-gradient(180deg, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.84) 36%, rgba(0,0,0,0.72) 100%);
    pointer-events:none;text-align:center;
  }
  .lockscreen-noteify-peek.show{display:flex;}
  .lockscreen-noteify-title{font-size:23px;font-weight:700;color:#fff;margin:0 0 6px 0;pointer-events:auto;cursor:pointer;padding:4px 12px;border-radius:10px;}
  .lockscreen-noteify-tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:2px 0 14px 0;pointer-events:auto;}
  .lockscreen-noteify-tab{appearance:none;border:1px solid rgba(255,255,255,0.22);background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.65);font-size:13px;font-weight:600;padding:4px 11px;border-radius:999px;cursor:pointer;font-family:inherit;}
  .lockscreen-noteify-tab.active{background:rgba(255,255,255,0.22);border-color:rgba(255,255,255,0.65);color:#fff;}
  .lockscreen-noteify-value{font-size:19px;font-weight:500;color:rgba(255,255,255,0.95);line-height:1.38;max-width:340px;width:100%;word-break:break-word;white-space:pre-wrap;margin:4px 0 0 0;}
  .lockscreen-noteify-lines{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;}
  .lockscreen-noteify-line{font-size:18.5px;font-weight:500;color:rgba(255,255,255,0.95);line-height:1.32;}
  .lockscreen-noteify-line .n-k{color:rgba(255,255,255,0.58);font-weight:600;font-size:14px;margin-right:6px;text-transform:uppercase;letter-spacing:0.3px;}
  .lockscreen-noteify-stack{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;max-width:340px;margin-top:6px;}
  .lockscreen-noteify-group{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;}
  .lockscreen-noteify-group-lbl{font-size:13px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;color:rgba(255,255,255,0.58);}
  .lockscreen-noteify-hint{margin-top:16px;font-size:12px;font-weight:500;color:rgba(255,255,255,0.42);}

  .lockscreen-footer{width:100%;max-width:320px;display:flex;justify-content:space-between;margin-bottom:max(48px, calc(env(safe-area-inset-bottom, 34px) + 20px));padding:0 clamp(16px, 5vw, 24px);}
  .lockscreen-footer button{background:none;border:0;color:#fff;font-size:16.5px;font-weight:400;font-family:inherit;padding:6px 0;cursor:pointer;min-width:64px;text-shadow:0 1px 2px rgba(0,0,0,0.35);}
  .lockscreen-footer #lockEmergencyBtn{text-align:left;}
  .lockscreen-footer #lockCancelBtn{text-align:right;}

  /* Paste / Photo Bar */
  .lockscreen-paste{
    position:fixed;bottom:clamp(220px, 36vh, 320px);left:50%;transform:translateX(-50%);
    z-index:99999;background:rgba(28,28,30,0.95);border:1px solid rgba(255,255,255,0.18);
    border-radius:18px;padding:8px 10px;display:none;align-items:center;gap:10px;
    backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
    box-shadow:0 12px 36px rgba(0,0,0,0.55);max-width:92vw;
  }
  .lockscreen-paste.show{display:flex;}
  .lockscreen-paste button{border:0;border-radius:10px;padding:8px 14px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;}
  .lockscreen-paste .paste-yes{background:#0a84ff;color:#fff;}
  .lockscreen-paste .paste-no{background:transparent;color:#8e8e93;padding:8px 10px;font-size:16px;}
  .lockscreen-paste .paste-pick{background:rgba(255,255,255,0.14);color:#fff;}
</style>
</head>
<body>

  <!-- ================= PIXEL-PERFECT iOS 26 APPLE NOTES ================= -->
  <div class="notes-app mode-typing" id="notesApp">
    <!-- Top Bar -->
    <header class="notes-nav">
      <!-- Top-Left Dark Glass Back Circle -->
      <button type="button" class="glass-circle-btn" id="notesBackBtn" aria-label="Back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>

      <!-- Top-Right Action Capsule + Gold Checkmark -->
      <div class="notes-nav-right">
        <div class="glass-pill-group" id="topActionPill">
          <!-- Undo / Redo (Shown in Draw mode when strokes exist) -->
          <button type="button" class="pill-icon-btn" id="topUndoBtn" style="display:none;" aria-label="Undo">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 14L4 9l5-5"/>
              <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/>
            </svg>
          </button>
          <button type="button" class="pill-icon-btn disabled" id="topRedoBtn" style="display:none;" aria-label="Redo">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 14l5-5-5-5"/>
              <path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5v0A5.5 5.5 0 0 0 9.5 20H13"/>
            </svg>
          </button>

          <!-- Share (Shown in Idle & Typing modes) -->
          <button type="button" class="pill-icon-btn" id="topShareBtn" aria-label="Share">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
              <polyline points="16 6 12 2 8 6"/>
              <line x1="12" y1="2" x2="12" y2="15"/>
            </svg>
          </button>

          <!-- More (...) -->
          <button type="button" class="pill-icon-btn" id="topMoreBtn" aria-label="More">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor">
              <circle cx="5" cy="12" r="1.9"/>
              <circle cx="12" cy="12" r="1.9"/>
              <circle cx="19" cy="12" r="1.9"/>
            </svg>
          </button>
        </div>

        <!-- Golden-Amber Done Checkmark Button -->
        <button type="button" class="gold-done-btn show" id="notesDoneBtn" aria-label="Done">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Pure Black Note Surface + Drawing Canvas -->
    <div class="notes-stage" id="notesStage">
      <textarea class="notes-body" id="notesBody" autocomplete="off" autocorrect="on" spellcheck="false"></textarea>
      <canvas class="notes-draw-canvas" id="notesDrawCanvas"></canvas>
    </div>

    <!-- STATE 1: IDLE BOTTOM BAR (00:04) -->
    <div class="idle-bottom-bar" id="idleBottomBar">
      <div class="idle-left-pill">
        <!-- Checklist -->
        <button type="button" class="pill-icon-btn" id="idleCheckBtn" aria-label="Checklist">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="5" cy="7" r="2"/><line x1="10" y1="7" x2="20" y2="7"/>
            <circle cx="5" cy="17" r="2"/><line x1="10" y1="17" x2="20" y2="17"/>
          </svg>
        </button>
        <!-- Paperclip -->
        <button type="button" class="pill-icon-btn" id="idleClipBtn" aria-label="Attach">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
          </svg>
        </button>
        <!-- Markup Pen-in-Circle -->
        <button type="button" class="pill-icon-btn" id="idleDrawBtn" aria-label="Markup">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9.5"/>
            <path d="M9.2 19.5l1.1-5.2L12 11l1.7 3.3 1.1 5.2"/>
            <line x1="10.2" y1="14.5" x2="13.8" y2="14.5"/>
          </svg>
        </button>
      </div>

      <!-- Bottom-Right New Note Compose Button -->
      <button type="button" class="idle-compose-btn" id="idleComposeBtn" aria-label="New Note">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
      </button>
    </div>

    <!-- STATE 2: FLOATING KEYBOARD ACCESSORY CAPSULE (00:00 - 00:06) -->
    <div class="kb-bar-wrap" id="kbBarWrap">
      <!-- Primary 5-Icon Bar (Aa, Checklist, Table, Paperclip, Markup) -->
      <div class="kb-capsule" id="kbMainCapsule">
        <button type="button" class="kb-tool-btn" id="kbAaBtn" style="font-size:17px;font-weight:600;letter-spacing:-0.3px;">Aa</button>
        <button type="button" class="kb-tool-btn" id="kbCheckBtn" aria-label="Checklist">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="5" cy="7" r="2"/><line x1="10" y1="7" x2="20" y2="7"/>
            <circle cx="5" cy="17" r="2"/><line x1="10" y1="17" x2="20" y2="17"/>
          </svg>
        </button>
        <button type="button" class="kb-tool-btn" id="kbTableBtn" aria-label="Table">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
            <line x1="3" y1="14" x2="21" y2="14"/>
            <line x1="10" y1="5" x2="10" y2="19"/>
          </svg>
        </button>
        <button type="button" class="kb-tool-btn" id="kbClipBtn" aria-label="Attach">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
          </svg>
        </button>
        <button type="button" class="kb-tool-btn" id="kbDrawBtn" aria-label="Markup">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9.5"/>
            <path d="M9.2 19.5l1.1-5.2L12 11l1.7 3.3 1.1 5.2"/>
            <line x1="10.2" y1="14.5" x2="13.8" y2="14.5"/>
          </svg>
        </button>
      </div>

      <!-- Secondary Format Bar when Aa is tapped (00:01: B, I, U, S, Highlight, Paperclip) -->
      <div class="kb-capsule" id="kbFormatCapsule" style="display:none;">
        <button type="button" class="kb-tool-btn gold-active" id="kbFmtBoldBtn">B</button>
        <button type="button" class="kb-tool-btn" id="kbFmtItalicBtn" style="font-style:italic;font-family:Georgia,serif;">I</button>
        <button type="button" class="kb-tool-btn" id="kbFmtUnderBtn" style="text-decoration:underline;">U</button>
        <button type="button" class="kb-tool-btn" id="kbFmtStrikeBtn" style="text-decoration:line-through;">S</button>
        <button type="button" class="kb-tool-btn" id="kbFmtHiBtn" aria-label="Highlight">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19l7-7 3 3-7 7-3-3z"/>

        </button>
        <button type="button" class="kb-tool-btn" id="kbFmtBackBtn" aria-label="Back to tools">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- STATE 3: PENCILKIT DRAWING TRAY & POPOVERS (00:07 - 00:15) -->
    <div class="pk-wrap" id="pkWrap">
      <!-- Stroke Width & Opacity Popover (00:09) -->

      </div>

      <!-- Eraser Mode Popover (00:13: Pixel Eraser | Object Eraser) -->
      <div class="pk-popover pk-eraser-popover" id="pkEraserPopover">

        <button type="button" class="pk-color-dot" data-col="#0a84ff" style="background:#0a84ff;"></button>
        <button type="button" class="pk-color-dot" data-col="#30d158" style="background:#30d158;"></button>
        <button type="button" class="pk-color-dot" data-col="#ff453a" style="background:#ff453a;"></button>
        <button type="button" class="pk-color-dot" data-col="#bf5af2" style="background:#bf5af2;"></button>

          <!-- 1. Pen / Fineliner -->
          <button type="button" class="pk-tool sel" data-pktool="pen" aria-label="Pen">
            <svg viewBox="0 0 28 72" fill="none">
              <path d="M12.5 5L14 1.5L15.5 5L17 14H11L12.5 5Z" fill="#d4d4d8"/>
              <path d="M13.2 1.5L14 0.5L14.8 1.5L15.2 4H12.8L13.2 1.5Z" class="pk-tip-tint" fill="#ffffff"/>

              <rect x="8.5" y="26" width="11" height="46" rx="1" fill="#18181b" stroke="rgba(255,255,255,0.12)" stroke-width="0.6"/>

            <svg viewBox="0 0 28 72" fill="none">

              <path d="M10 13H18L20 24H8L10 13Z" fill="#3f3f46"/>
              <rect x="8" y="24" width="12" height="48" rx="1" fill="#18181b" stroke="rgba(255,255,255,0.12)" stroke-width="0.6"/>

              <path d="M9 13H19L21 24H7L9 13Z" fill="#27272a"/>
              <rect x="7" y="24" width="14" height="48" rx="1" fill="#18181b" stroke="rgba(255,255,255,0.12)" stroke-width="0.6"/>
              <rect x="7" y="32" width="14" height="8" fill="#eab308"/>

          </button>

          <!-- 4. Eraser (Pink rubber tip + X badge) -->
          <button type="button" class="pk-tool" data-pktool="eraser" aria-label="Eraser">

        </div>

        <div class="pk-right-controls">
          <button type="button" class="pk-wheel-btn" id="pkColorWheelBtn" aria-label="Color Picker"></button>

              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- CUSTOM SCREENSHOT OUTCOME -->
  <div class="custom-shot-view" id="customShotView">
    <img id="customShotImg" alt="">
    <button type="button" class="custom-shot-bottom-tap" id="customShotBottomTap" aria-label="Open link"></button>

  <!-- FAKE iOS 26 LOCK SCREEN -->

    <div class="lockscreen-scrim"></div>

      <div class="lockscreen-prompt-wrap">
        <div class="lockscreen-prompt" id="lockPrompt">Enter Passcode</div>
        <div class="lockscreen-subprompt" id="lockSubPrompt">Your passcode is required<br>to enable Face&nbsp;ID</div>
      </div>
      <div class="lockscreen-dots" id="lockDots"></div>
      <div class="lockscreen-keypad" id="lockKeypad"></div>
      <div class="lockscreen-bottomspace" aria-hidden="true"></div>
      <div class="lockscreen-footer">
        <button type="button" id="lockEmergencyBtn">Emergency</button>
        <button type="button" id="lockCancelBtn">Cancel</button>
      </div>
    </div>
    <div class="lockscreen-noteify-peek" id="lockNoteifyPeek" aria-hidden="true">
      <div class="lockscreen-noteify-title" id="lockNoteifyTitle">API Peek</div>

function toSafariUrl(u) {
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (isIOS) {
    if (/^https:\/\//i.test(u)) return u.replace(/^https:\/\//i, "x-safari-https://");
    if (/^http:\/\//i.test(u)) return u.replace(/^http:\/\//i, "x-safari-http://");
  }
  return u;
}

function openShortcutInSafari(rawUrl) {
  let u = (rawUrl || "").trim();
  if (!u) return false;
  if (!/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(u)) u = "https://" + u;
  const safariUrl = toSafariUrl(u);
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  try {
    if (isIOS) {
      try { window.location.href = safariUrl; } catch (_) {}
      try {
        const a = document.createElement("a");
        a.href = u;
        a.target = "_blank";
        a.rel = "noreferrer noopener";
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { try { document.body.removeChild(a); } catch (_) {} }, 150);
      } catch (_) {}
      return true;
    }
    window.open(u, "_blank");
    return true;
  } catch (_) {
    try { window.location.href = safariUrl; } catch (_) {}
  }
  return false;
}

/* ===== iOS 26 Apple Notes State Machine (idle | typing | draw) ===== */
const notesApp = document.getElementById("notesApp");
const notesBody = document.getElementById("notesBody");
const notesDoneBtn = document.getElementById("notesDoneBtn");
const topActionPill = document.getElementById("topActionPill");
const topUndoBtn = document.getElementById("topUndoBtn");
const topRedoBtn = document.getElementById("topRedoBtn");
const topShareBtn = document.getElementById("topShareBtn");
const kbBarWrap = document.getElementById("kbBarWrap");
const kbMainCapsule = document.getElementById("kbMainCapsule");
const kbFormatCapsule = document.getElementById("kbFormatCapsule");
const drawCanvas = document.getElementById("notesDrawCanvas");
const drawCtx = drawCanvas.getContext("2d");

let appMode = "typing"; // "idle" | "typing" | "draw"
let pkTool = "pen"; // "pen" | "marker" | "highlighter" | "eraser"
let eraserMode = "object"; // "object" | "pixel"
let penColor = "#ffffff";
let strokeWidth = 3.2;
let strokeOpacity = 1.0;
let strokes = [];
let redoStack = [];
let currentStroke = null;

function setNotesMode(mode) {
  appMode = mode;
  notesApp.classList.toggle("mode-idle", mode === "idle");
  notesApp.classList.toggle("mode-typing", mode === "typing");
  notesApp.classList.toggle("mode-draw", mode === "draw");
  closeAllPkPopovers();

  if (mode === "idle") {
    notesDoneBtn.classList.remove("show");
    topShareBtn.style.display = "inline-flex";
    topUndoBtn.style.display = "none";
    topRedoBtn.style.display = "none";
    topActionPill.classList.remove("single-circle");
    notesBody.blur();
  } else if (mode === "typing") {
    notesDoneBtn.classList.add("show");
    topShareBtn.style.display = "inline-flex";
    topUndoBtn.style.display = "none";
    topRedoBtn.style.display = "none";
    topActionPill.classList.remove("single-circle");
    kbMainCapsule.style.display = "flex";
    kbFormatCapsule.style.display = "none";
  } else if (mode === "draw") {
    notesDoneBtn.classList.add("show");
    topShareBtn.style.display = "none";
    notesBody.blur();
    updateTopUndoRedoUI();
  }
}

function updateTopUndoRedoUI() {
  if (appMode !== "draw") return;
  const hasHistory = strokes.length > 0 || redoStack.length > 0;
  if (hasHistory) {
    topUndoBtn.style.display = "inline-flex";
    topRedoBtn.style.display = "inline-flex";
    topUndoBtn.classList.toggle("disabled", strokes.length === 0);
    topRedoBtn.classList.toggle("disabled", redoStack.length === 0);
    topActionPill.classList.remove("single-circle");
  } else {
    topUndoBtn.style.display = "none";
    topRedoBtn.style.display = "none";
    topActionPill.classList.add("single-circle");
  }
}

/* Keep floating keyboard capsule above iOS virtual keyboard */
function syncKeyboardOffset() {
  if (!window.visualViewport) return;
  const vv = window.visualViewport;
  const kbHeight = Math.max(0, window.innerHeight - (vv.height + vv.offsetTop));
  if (kbHeight > 40) {
    kbBarWrap.style.bottom = (kbHeight + 8) + "px";
  } else {
    kbBarWrap.style.bottom = "max(14px, env(safe-area-inset-bottom, 12px))";
  }
}
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", syncKeyboardOffset);
  window.visualViewport.addEventListener("scroll", syncKeyboardOffset);
}

notesBody.addEventListener("focus", () => {
  if (appMode !== "draw") setNotesMode("typing");
});
notesBody.addEventListener("input", () => scheduleNotesSync());

notesDoneBtn.addEventListener("click", () => {

});

/* Keyboard Capsule Actions */
document.getElementById("kbAaBtn").addEventListener("click", (e) => {

document.getElementById("kbFmtBackBtn").addEventListener("click", (e) => {

/* ===== PencilKit Drawing Canvas & Tools ===== */
function resizeDrawCanvas() {
  const stage = document.getElementById("notesStage");
  const dpr = Math.min(2, window.devicePixelRatio || 2);
  drawCanvas.width = Math.max(1, Math.round(stage.clientWidth * dpr));
  drawCanvas.height = Math.max(1, Math.round(stage.clientHeight * dpr));
  drawCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  redrawCanvas();
}
function redrawCanvas() {
  drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  for (const s of strokes) {
    if (!s.pts || !s.pts.length) continue;
    drawCtx.save();
    drawCtx.lineCap = "round";
    drawCtx.lineJoin = "round";
    if (s.tool === "eraser") {
      drawCtx.globalCompositeOperation = "destination-out";
      drawCtx.lineWidth = 20;
      drawCtx.strokeStyle = "rgba(0,0,0,1)";
    } else {
      drawCtx.globalCompositeOperation = "source-over";
      drawCtx.globalAlpha = s.opacity ?? 1;
      drawCtx.lineWidth = s.width || 3.2;
      drawCtx.strokeStyle = s.color || "#ffffff";
    }
    drawCtx.beginPath();
    drawCtx.moveTo(s.pts[0].x, s.pts[0].y);
    for (let i = 1; i < s.pts.length; i++) {
      const prev = s.pts[i - 1], cur = s.pts[i];
      const mx = (prev.x + cur.x) * 0.5, my = (prev.y + cur.y) * 0.5;
      drawCtx.quadraticCurveTo(prev.x, prev.y, mx, my);
    }
    const last = s.pts[s.pts.length - 1];
    drawCtx.lineTo(last.x + 0.05, last.y + 0.05);
    drawCtx.stroke();
    drawCtx.restore();
  }
}
window.addEventListener("resize", resizeDrawCanvas);
setTimeout(resizeDrawCanvas, 50);

function closeAllPkPopovers() {
  document.getElementById("pkStrokePopover").classList.remove("show");
  document.getElementById("pkEraserPopover").classList.remove("show");
  document.getElementById("pkColorPopover").classList.remove("show");
}

function updatePenTintUI() {
  document.querySelectorAll(".pk-tip-tint, .pk-band-tint").forEach(el => {
    el.setAttribute("fill", penColor);
  });
  document.getElementById("pkOpacityFill").style.background = `linear-gradient(90deg, rgba(255,255,255,0) 0%, ${penColor} 100%)`;
}

document.querySelectorAll(".pk-tool").forEach(btn => {
  btn.addEventListener("click", () => {
    const clickedTool = btn.dataset.pktool;
    const wasSelected = (pkTool === clickedTool);
    pkTool = clickedTool;
    document.querySelectorAll(".pk-tool").forEach(b => b.classList.toggle("sel", b === btn));

    if (clickedTool === "eraser") {
      document.getElementById("pkStrokePopover").classList.remove("show");
      document.getElementById("pkColorPopover").classList.remove("show");
      if (wasSelected) {
        document.getElementById("pkEraserPopover").classList.toggle("show");
      } else {
        document.getElementById("pkEraserPopover").classList.remove("show");
      }
    } else {
      document.getElementById("pkEraserPopover").classList.remove("show");
      document.getElementById("pkColorPopover").classList.remove("show");
      if (clickedTool === "pen") { strokeWidth = 3.2; strokeOpacity = 1.0; }
      else if (clickedTool === "marker") { strokeWidth = 6.5; strokeOpacity = 0.95; }
      else if (clickedTool === "highlighter") { strokeWidth = 14; strokeOpacity = 0.45; }
      if (wasSelected) {
        document.getElementById("pkStrokePopover").classList.toggle("show");
      } else {
        document.getElementById("pkStrokePopover").classList.remove("show");
      }
    }
  });
});

document.querySelectorAll(".pk-sq-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    strokeWidth = Number(btn.dataset.w) || 3.2;
    document.querySelectorAll(".pk-sq-btn").forEach(b => b.classList.toggle("sel", b === btn));
  });
});
document.getElementById("pkOpacityRange").addEventListener("input", (e) => {
  strokeOpacity = Number(e.target.value) || 1;
});

document.getElementById("erPixelBtn").addEventListener("click", () => {
  eraserMode = "pixel";
  document.getElementById("erPixelBtn").classList.add("sel");
  document.getElementById("erObjectBtn").classList.remove("sel");
});
document.getElementById("erObjectBtn").addEventListener("click", () => {
  eraserMode = "object";
  document.getElementById("erObjectBtn").classList.add("sel");
  document.getElementById("erPixelBtn").classList.remove("sel");
});

document.getElementById("pkColorWheelBtn").addEventListener("click", () => {
  const pop = document.getElementById("pkColorPopover");
  const isShown = pop.classList.contains("show");
  closeAllPkPopovers();
  if (!isShown) pop.classList.add("show");
});
document.querySelectorAll(".pk-color-dot").forEach(dot => {
  dot.addEventListener("click", () => {
    penColor = dot.dataset.col;
    document.querySelectorAll(".pk-color-dot").forEach(d => d.classList.toggle("sel", d === dot));
    updatePenTintUI();
    closeAllPkPopovers();
  });
});

topUndoBtn.addEventListener("click", () => {
  if (!strokes.length) return;
  redoStack.push(strokes.pop());
  redrawCanvas();
  updateTopUndoRedoUI();
  scheduleNotesSync();
});
topRedoBtn.addEventListener("click", () => {
  if (!redoStack.length) return;
  strokes.push(redoStack.pop());
  redrawCanvas();
  updateTopUndoRedoUI();
  scheduleNotesSync();
});

/* Object Eraser hit-test: erases entire stroke when touched (matches 00:13-00:14) */
function eraseObjectAt(x, y) {
  let removed = false;
  for (let i = strokes.length - 1; i >= 0; i--) {
    const s = strokes[i];
    if (s.tool === "eraser") continue;
    const hitRadius = Math.max(18, (s.width || 3.2) + 12);
    const hr2 = hitRadius * hitRadius;
    for (const p of s.pts) {
      const dx = p.x - x, dy = p.y - y;
      if (dx * dx + dy * dy <= hr2) {
        redoStack.push(strokes.splice(i, 1)[0]);
        removed = true;
        break;
      }
    }
  }
  if (removed) {
    redrawCanvas();
    updateTopUndoRedoUI();
    scheduleNotesSync();
  }
}

let isDrawing = false;
drawCanvas.addEventListener("pointerdown", (e) => {
  if (appMode !== "draw") return;
  closeAllPkPopovers();
  isDrawing = true;
  const r = drawCanvas.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  try { drawCanvas.setPointerCapture(e.pointerId); } catch (_) {}

  if (pkTool === "eraser" && eraserMode === "object") {
    eraseObjectAt(x, y);
    return;
  }
  redoStack = [];
  const col = pkTool === "highlighter" && penColor === "#ffffff" ? "#facc15" : penColor;
  currentStroke = {
    tool: pkTool,
    color: col,
    width: strokeWidth,
    opacity: strokeOpacity,
    pts: [{ x, y }]
  };
  strokes.push(currentStroke);
  redrawCanvas();
  updateTopUndoRedoUI();
});

drawCanvas.addEventListener("pointermove", (e) => {
  if (!isDrawing) return;
  const r = drawCanvas.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  if (pkTool === "eraser" && eraserMode === "object") {
    eraseObjectAt(x, y);
    return;
  }
  if (!currentStroke) return;
  currentStroke.pts.push({ x, y });
  redrawCanvas();
});

const finishDraw = () => {
  if (!isDrawing) return;
  isDrawing = false;
  currentStroke = null;
  updateTopUndoRedoUI();
  scheduleNotesSync();
};
drawCanvas.addEventListener("pointerup", finishDraw);
drawCanvas.addEventListener("pointercancel", finishDraw);

/* Live Notes Peek Sync */
let syncTimer = null;
function scheduleNotesSync() {
  clearTimeout(syncTimer);
  syncTimer = setTimeout(pushNotesPeek, 280);
}
function pushNotesPeek() {
  const base = getBackendBase();
  if (!base) return;
  const drawingDataUrl = strokes.length ? drawCanvas.toDataURL("image/png") : "";
  fetch(base + "/api/notes/peek", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      title: "",
      text: notesBody.value,
      drawingDataUrl,
      mode: appMode === "draw" ? "draw" : "text"
    })
  }).catch(() => {});
}

/* Covert Triggers on Top-Left "<" Button:
   - Hold 450ms: Open LockScreen (backup for Volume Up)
   - Triple-tap: Configure Backend URL */
(function bindBackBtnTriggers() {
  const btn = document.getElementById("notesBackBtn");
  let holdTimer = null, taps = 0, tapTimer = null;
  btn.addEventListener("pointerdown", () => {
    clearTimeout(holdTimer);
    holdTimer = setTimeout(() => {
      holdTimer = null;
      taps = 0;
      LockScreen.show();
    }, 450);
  });
  const clearHold = () => { clearTimeout(holdTimer); holdTimer = null; };
  btn.addEventListener("pointerup", clearHold);
  btn.addEventListener("pointercancel", clearHold);
  btn.addEventListener("pointerleave", clearHold);

  btn.addEventListener("click", () => {
    taps++;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(() => { taps = 0; }, 700);
    if (taps >= 3) {
      taps = 0;
      const cur = getBackendBase();
      const next = prompt("Enter Backend URL (Render):", cur);
      if (next !== null) {
        try { localStorage.setItem("notes_backend_url", next.trim().replace(/\/+$/, "")); } catch (_) {}
        syncConfigFromBackend();
      }
    }
  });
})();

/* ===== Volume Up Trigger (AuraKit) ===== */
async function initVolumeTrigger() {
  if (!window.AuraKit) return;
  try { await AuraKit.ready(); } catch (_) { return; }
  const handleVol = (ev) => {
    const dir = (ev && (ev.button || ev.direction || ev.type || "")).toString().toLowerCase();
    if (!dir || dir.includes("up")) {
      if (!LockScreen.open) LockScreen.show();
    }
  };
  try {
    if (AuraKit.volumeButtons && typeof AuraKit.volumeButtons.watch === "function") {
      AuraKit.volumeButtons.watch("up", handleVol);
    }
    if (typeof AuraKit.on === "function") {
      AuraKit.on("volumeButton", handleVol);
    }
  } catch (_) {}
}
initVolumeTrigger();

/* ===== Fake iOS 26 Lock Screen ===== */
const LockScreen = window.LockScreen = {
  open: false,
  digits: CFG.lockDigits || 4,
  code: "",
  attemptCount: 0,
  wallpaperDataUrl: "",
  holdTimers: {},
  _apiCache: {},
  _apiPeekIndex: 0,

  init() {
    try {
      const savedWall = localStorage.getItem("notes_lock_wallpaper");
      const savedCleaned = localStorage.getItem("notes_lock_wallpaper_cleaned") === "1";
      if (savedWall) {
        this.wallpaperDataUrl = savedWall;
        this.wallpaperCleaned = savedCleaned;
        this._preloadLensImage(savedWall);
      }
    } catch (_) {}

    if (!this._resizeBound) {
      this._resizeBound = true;
      window.addEventListener("resize", () => { if (this.open) this.renderLiquidGlassLenses(true); });
      const onResume = () => {
        if (document.visibilityState && document.visibilityState !== "visible") return;
        this.restorePendingPastePrompt();
        this.fetchAllApiPeeks();
        if (this.open) requestAnimationFrame(() => this.renderLiquidGlassLenses(true));
      };
      document.addEventListener("visibilitychange", onResume);
      window.addEventListener("pageshow", onResume);
      window.addEventListener("focus", onResume);
    }
    this.restorePendingPastePrompt();

    const kp = document.getElementById("lockKeypad");
    if (!kp || kp.dataset.built) return;
    kp.dataset.built = "1";
    const layout = [
      ["1", ""], ["2", "ABC"], ["3", "DEF"],
      ["4", "GHI"], ["5", "JKL"], ["6", "MNO"],
      ["7", "PQRS"], ["8", "TUV"], ["9", "WXYZ"],
      ["", ""], ["0", ""], ["", ""]
    ];
    layout.forEach(([n, letters], idx) => {
      const b = document.createElement("button");
      b.type = "button";
      if (n === "" && idx === 9) {
        b.className = "lockscreen-corner-zone"; b.setAttribute("aria-hidden", "true"); b.tabIndex = -1;
        let t = null;
        b.addEventListener("pointerdown", (e) => { e.preventDefault(); clearTimeout(t); t = setTimeout(() => { t = null; this.resetPasscodeAttempts(); }, 450); });
        const c = () => { clearTimeout(t); t = null; };
        b.addEventListener("pointerup", c); b.addEventListener("pointercancel", c); b.addEventListener("pointerleave", c);
        kp.appendChild(b); return;
      }
      if (n === "" && idx === 11) {
        b.className = "lockscreen-corner-zone"; b.setAttribute("aria-hidden", "true"); b.tabIndex = -1;
        let t = null, active = false, ox = 0, pid = null;
        b.addEventListener("pointerdown", (e) => {
          e.preventDefault(); pid = e.pointerId; ox = e.clientX; active = false;
          try { b.setPointerCapture(e.pointerId); } catch (_) {}
          clearTimeout(t); t = setTimeout(() => { t = null; active = true; this.showNoteifyApiPeek(); }, 110);
        });
        b.addEventListener("pointermove", (e) => {
          if (!active || (pid !== null && e.pointerId !== pid)) return;
          if (Math.abs(e.clientX - ox) >= 42) { ox = e.clientX; this.cycleNoteifyApiPeek(e.clientX < ox ? 1 : -1); }
        });
        const h = () => { clearTimeout(t); t = null; pid = null; if (active) { active = false; this.hideNoteifyApiPeek(); } };
        b.addEventListener("pointerup", h); b.addEventListener("pointercancel", h);
        kp.appendChild(b); return;
      }

      b.className = "lockscreen-key" + (n === "0" ? " key-0" : "");
      b.dataset.n = n;
      const glassLayers = `<canvas class="glass-lens" aria-hidden="true"></canvas><span class="glass-rim" aria-hidden="true"></span><span class="glass-flash" aria-hidden="true"></span>`;
      if (n === "0") b.innerHTML = `${glassLayers}<span class="digit">0</span>`;
      else if (n === "1") b.innerHTML = `${glassLayers}<span class="digit">1</span><span class="letters empty">&nbsp;</span>`;
      else b.innerHTML = `${glassLayers}<span class="digit">${n}</span><span class="letters">${letters}</span>`;

      let lastTap = 0, holding = false, relTimer = null;
      b.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        const now = Date.now();
        if (now - lastTap < 45) return;
        lastTap = now; b._pressStart = now; holding = true;
        clearTimeout(relTimer); b.classList.add("is-pressed");
        this.tap(n);
      });
      b.addEventListener("click", (e) => e.preventDefault());
      const unpress = () => {
        if (!holding) return; holding = false;
        const holdMin = Math.max(0, 90 - (Date.now() - (b._pressStart || 0)));
        clearTimeout(relTimer); relTimer = setTimeout(() => b.classList.remove("is-pressed"), holdMin);
      };

  _preloadLensImage(src) {

  async renderLiquidGlassLenses(force) {

    keys.forEach(k => k.classList.toggle("glass-mode-backdrop", glassStyle === "backdrop"));
    if (glassStyle === "backdrop" || !this.wallpaperDataUrl) {

      } else {
        tmpCtx.drawImage(img, drawX * ds, 0, drawW * ds, drawH * ds);

      const srcC = document.createElement("canvas"); srcC.width = vw; srcC.height = vh;
      const srcCtx = srcC.getContext("2d"); srcCtx.imageSmoothingQuality = "high";

        const tx = cx - x0, ty = cy - y0;
        const i00 = ((y0 * vw + x0) << 2) + ch, i10 = ((y0 * vw + x1) << 2) + ch;

      };
      for (const btn of keys) {
        const canvas = btn.querySelector("canvas.glass-lens"), box = getRestingBox(btn);
        if (!canvas || !box.w) continue;
        const size = Math.round(box.w * dpr);
        if (canvas.width !== size || canvas.height !== size) { canvas.width = size; canvas.height = size; }

  },

  async doPasteWallpaper() {

        for (const item of items) {
          const t = item.types.find(x => x.startsWith("image/"));

  applyWallpaperFile(file) {

  async cleanWallpaperAI(dataUrl) {

      const d = await res.json().catch(() => ({}));
      if (res.ok && d.ok && (d.dataUrl || d.url)) {

  _apiPeekShowAll: false,

  getApiPeekFeeds() {
    const raw = (CFG && Array.isArray(CFG.lockApiPeeks)) ? CFG.lockApiPeeks : [];
    const valid = raw.filter(it => it && (it.url || it.label));
    if (valid.length) return valid;
    const fallbackUrl = (CFG && CFG.injectApiUrl) ? CFG.injectApiUrl.trim() : "";

  _getByDotPath(obj, pathStr) {
    if (!obj || !pathStr) return undefined;
    const parts = pathStr.trim().split(".");
    let cur = obj;
    for (const p of parts) {
      if (cur == null || typeof cur !== "object") return undefined;
      if (p in cur) cur = cur[p];
      else {
        const lower = p.toLowerCase();
        const mk = Object.keys(cur).find(k => k.toLowerCase() === lower);
        if (mk !== undefined) cur = cur[mk];
        else return undefined;
      }
    }
    return cur;
  },

  _itemToString(item) {
    if (item === null || item === undefined) return "";
    if (typeof item !== "object") return String(item).trim();
    for (const k of ["value", "selection", "text", "word", "result", "output", "message", "data", "latest", "content", "name"]) {
      if (item[k] !== undefined && item[k] !== null && typeof item[k] !== "object" && String(item[k]).trim() !== "") {
        return String(item[k]).trim();
      }
    }
    return JSON.stringify(item);
  },

  extractApiValues(rawText, fieldPath, maxValues) {
    const txt = String(rawText ?? "").trim();
    if (!txt) return [{ k: "", v: "—" }];
    const limit = (maxValues === "all") ? 50 : Math.max(1, parseInt(maxValues, 10) || 1);
    const wantMulti = (limit > 1);
    try {
      const parsed = JSON.parse(txt);
      if (parsed === null || parsed === undefined) return [{ k: "", v: "—" }];
      if (typeof parsed !== "object") return [{ k: "", v: String(parsed) }];

      const fp = String(fieldPath || "").trim();
      if (fp && fp !== "*") {
        const paths = fp.split(",").map(s => s.trim()).filter(Boolean);
        if (Array.isArray(parsed)) {
          const recentItems = parsed.slice(-limit).reverse();
          const out = [];
          for (const entry of recentItems) {
            if (!entry || typeof entry !== "object") continue;
            for (const p of paths) {
              const val = this._getByDotPath(entry, p);
              if (val !== undefined && val !== null && String(val).trim() !== "") {
                out.push({ k: paths.length > 1 ? p.split(".").pop() : "", v: typeof val === "object" ? this._itemToString(val) : String(val).trim() });
              }
            }
          }
          if (out.length) return out;
        } else if (paths.length > 1) {
          const out = [];
          for (const p of paths) {
            const val = this._getByDotPath(parsed, p);
            if (val !== undefined && val !== null && String(val).trim() !== "") {
              out.push({ k: p.split(".").pop(), v: typeof val === "object" ? this._itemToString(val) : String(val).trim() });
            }
          }
          if (out.length) return out;
        } else if (paths.length === 1) {
          const val = this._getByDotPath(parsed, paths[0]);
          if (Array.isArray(val)) {
            const slice = val.slice(-limit).reverse().map(x => ({ k: "", v: this._itemToString(x) })).filter(x => x.v);
            if (slice.length) return slice;
          } else if (val !== undefined && val !== null) {
            return [{ k: "", v: typeof val === "object" ? this._itemToString(val) : String(val).trim() }];
          }
        }
      }

      if (Array.isArray(parsed)) {
        const slice = parsed.slice(-limit).reverse().map(x => ({ k: "", v: this._itemToString(x) })).filter(x => x.v);
        return slice.length ? slice : [{ k: "", v: "—" }];
      }
      if (fp === "*" || wantMulti) {
        const out = [];
        for (const k of Object.keys(parsed)) {
          const v = parsed[k];
          if (v === undefined || v === null) continue;
          if (Array.isArray(v)) {
            v.slice(-limit).reverse().map(x => this._itemToString(x)).filter(Boolean).forEach(av => out.push({ k: "", v: av }));
            if (out.length >= limit) break;
          } else if (typeof v !== "object" && String(v).trim() !== "") {
            out.push({ k, v: String(v).trim() });
            if (out.length >= limit) break;
          }
        }
        if (out.length) return out;
      }
      for (const k of ["value", "selection", "text", "word", "result", "output", "message", "data", "latest", "content", "name"]) {
        if (parsed[k] !== undefined && parsed[k] !== null && String(parsed[k]).trim() !== "") {
          return [{ k: "", v: typeof parsed[k] === "object" ? this._itemToString(parsed[k]) : String(parsed[k]).trim() }];
        }
      }
      for (const k of Object.keys(parsed)) {
        const v = parsed[k];
        if (v !== undefined && v !== null && typeof v !== "object" && String(v).trim() !== "") return [{ k: "", v: String(v).trim() }];
      }
      return [{ k: "", v: JSON.stringify(parsed) }];
    } catch (_) {
      const lines = txt.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      if (wantMulti && lines.length > 1) return lines.slice(-limit).reverse().map(v => ({ k: "", v }));
      return [{ k: "", v: txt }];
    }
  },

  _apiFeedCacheKey(feed) {

  },

  async fetchSingleApiPeek(feed) {

      const r = await fetch(u, { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);

    };
    try {
      let text = "";
      try { text = await tryFetch(feed.url); }
      catch (_) { text = await tryFetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(feed.url)); }
      const vals = this.extractApiValues(text, feed.field, feed.maxValues || "1");
      this._apiCache[key] = vals;
      return vals;
    } catch (_) {
      return this._apiCache[key] || [{ k: "", v: "Unable to fetch" }];
    }
  },

  async fetchAllApiPeeks() {
    const feeds = this.getApiPeekFeeds();
    if (!feeds.length) return;
    await Promise.all(feeds.map(f => this.fetchSingleApiPeek(f)));
    const ov = document.getElementById("lockNoteifyPeek");
    if (ov && ov.classList.contains("show")) this.renderNoteifyApiPeek();
  },

  _buildNoteifyLinesNode(items) {
    const wrap = document.createElement("div");
    wrap.className = "lockscreen-noteify-lines";
    const list = (Array.isArray(items) && items.length) ? items : [{ k: "", v: "Loading..." }];
    list.forEach(({ k, v }) => {
      const row = document.createElement("div");
      row.className = "lockscreen-noteify-line";
      if (k) {
        const ks = document.createElement("span");
        ks.className = "n-k";
        ks.textContent = k + ":";
        row.appendChild(ks);
      }
      row.appendChild(document.createTextNode(String(v ?? "—")));
      wrap.appendChild(row);
    });
    return wrap;
  },

  renderNoteifyApiPeek() {
    const titleEl = document.getElementById("lockNoteifyTitle");
    const tabsEl = document.getElementById("lockNoteifyTabs");
    const valEl = document.getElementById("lockNoteifyValue");
    const hintEl = document.getElementById("lockNoteifyHint");
    const feeds = this.getApiPeekFeeds();
    if (!feeds.length) {
      if (titleEl) titleEl.textContent = "API Peek";
      if (tabsEl) tabsEl.innerHTML = "";
      if (valEl) valEl.textContent = "Add an API URL in Controller Settings";
      if (hintEl) hintEl.textContent = "";
      return;
    }
    const showAll = this._apiPeekShowAll && feeds.length > 1;
    this._apiPeekIndex = ((this._apiPeekIndex % feeds.length) + feeds.length) % feeds.length;

    if (tabsEl) {
      tabsEl.innerHTML = "";
      if (feeds.length > 1) {
        feeds.forEach((f, idx) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "lockscreen-noteify-tab" + (!showAll && idx === this._apiPeekIndex ? " active" : "");
          btn.textContent = f.label || ("API " + (idx + 1));
          btn.addEventListener("pointerdown", (e) => {
            e.preventDefault(); e.stopPropagation();
            this._apiPeekShowAll = false;
            this._apiPeekIndex = idx;
            this.renderNoteifyApiPeek();
            this.fetchSingleApiPeek(f).then(() => {
              if (document.getElementById("lockNoteifyPeek").classList.contains("show")) this.renderNoteifyApiPeek();
            });
          });
          tabsEl.appendChild(btn);
        });
        const allBtn = document.createElement("button");
        allBtn.type = "button";
        allBtn.className = "lockscreen-noteify-tab" + (showAll ? " active" : "");
        allBtn.textContent = "All";
        allBtn.addEventListener("pointerdown", (e) => {
          e.preventDefault(); e.stopPropagation();
          this._apiPeekShowAll = true;
          this.renderNoteifyApiPeek();
          this.fetchAllApiPeeks();
        });
        tabsEl.appendChild(allBtn);
      }
    }

    if (showAll) {
      titleEl.textContent = "All Feeds";
      valEl.innerHTML = "";
      const stack = document.createElement("div");
      stack.className = "lockscreen-noteify-stack";
      feeds.forEach((f, idx) => {
        const grp = document.createElement("div");
        grp.className = "lockscreen-noteify-group";
        const lbl = document.createElement("div");
        lbl.className = "lockscreen-noteify-group-lbl";
        lbl.textContent = f.label || ("API " + (idx + 1));
        grp.appendChild(lbl);
        grp.appendChild(this._buildNoteifyLinesNode(this._apiCache[this._apiFeedCacheKey(f)]));
        stack.appendChild(grp);
      });
      valEl.appendChild(stack);
      hintEl.textContent = "Swipe or tap a label to focus one";
      return;
    }

    const feed = feeds[this._apiPeekIndex];
    titleEl.textContent = feed.label || ("API " + (this._apiPeekIndex + 1));
    valEl.innerHTML = "";
    valEl.appendChild(this._buildNoteifyLinesNode(this._apiCache[this._apiFeedCacheKey(feed)]));
    hintEl.textContent = feeds.length > 1 ? "Swipe left/right or tap a label" : "";
  },

  showNoteifyApiPeek() {
    const ov = document.getElementById("lockNoteifyPeek");
    this._apiPeekShowAll = (CFG && CFG.lockApiPeekMode === "all");
    this.renderNoteifyApiPeek();
    ov.classList.add("show");
    this.fetchAllApiPeeks();
  },
  cycleNoteifyApiPeek(delta) {
    const feeds = this.getApiPeekFeeds();
    if (feeds.length <= 1) return;
    if (this._apiPeekShowAll) this._apiPeekShowAll = false;
    else this._apiPeekIndex = ((this._apiPeekIndex + (delta || 1)) % feeds.length + feeds.length) % feeds.length;
    this.renderNoteifyApiPeek();
    const feed = feeds[this._apiPeekIndex];
    if (feed) {
      this.fetchSingleApiPeek(feed).then(() => {
        if (document.getElementById("lockNoteifyPeek").classList.contains("show")) this.renderNoteifyApiPeek();
      });
    }
  },
  hideNoteifyApiPeek() {
    document.getElementById("lockNoteifyPeek").classList.remove("show");
  }
};

LockScreen.init();
setNotesMode("idle");

document.getElementById("customShotBottomTap").addEventListener("click", () => {
  let url = (CFG.screenshotBottomUrl || "").trim();
  if (!url) return;
  if (!/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(url)) url = "https://" + url;
  window.location.href = url;
});
</script>
